<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Koshur Kanvas</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafrex/spa-github-pages
      // This script takes the current url and redirects to the index.html with the query parameters encoded.
      var l = window.location;
      var segments = l.pathname.split('/').filter(Boolean);
      // If deployed on github.io with a subpath (e.g. username.github.io/repo-name/)
      var pathSegmentsToKeep = (l.hostname.endsWith('github.io') && segments.length > 0) ? 1 : 0;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
