name: Build & Sign Android Release (APK & AAB)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-release:
    name: Build Signed Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Version Info from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION_NAME=$VERSION" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=${{ github.run_number || 2 }}" >> $GITHUB_ENV
          echo "App version is $VERSION (code: ${{ github.run_number || 2 }})"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript & Lint checks
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Accept Android SDK Licenses & Grant Executable Permissions
        run: |
          chmod +x android/gradlew
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Decode Android Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not configured in GitHub repository settings."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ${{ runner.temp }}/release.keystore
          if [ ! -s "${{ runner.temp }}/release.keystore" ]; then
            echo "::error::Decoded keystore file is empty. Please verify ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "Release keystore decoded successfully."

      - name: Build Signed Android Release APK & AAB
        working-directory: ./android
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify APK & AAB Signatures
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Release APK not found at $APK_PATH"
            exit 1
          fi
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::Release AAB not found at $AAB_PATH"
            exit 1
          fi

          echo "Verifying APK Signature with apksigner..."
          BUILD_TOOLS_VER=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS_VER/apksigner verify --verbose "$APK_PATH"

          echo "Verifying AAB Signature with jarsigner..."
          jarsigner -verify -verbose -certs "$AAB_PATH"

          echo "✅ Both APK and AAB signatures verified successfully!"

      - name: Prepare Signed Artifact Files
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk KoshurKanvas-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab KoshurKanvas-release.aab

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoshurKanvas-release.apk
          path: KoshurKanvas-release.apk
          retention-days: 30

      - name: Upload Signed Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KoshurKanvas-release.aab
          path: KoshurKanvas-release.aab
          retention-days: 30

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KoshurKanvas-release.apk
            KoshurKanvas-release.aab
          name: "KoshurKanvas Release v${{ env.APP_VERSION_NAME || '1.0.1' }}"
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.APP_VERSION_NAME || '1.0.1') }}
          body: |
            ## KoshurKanvas Official Release v${{ env.APP_VERSION_NAME || '1.0.1' }}
            
            - **Signed Release APK**: `KoshurKanvas-release.apk`
            - **Google Play Bundle**: `KoshurKanvas-release.aab`
            - **Version Code**: `${{ env.APP_VERSION_CODE || 2 }}`
            
            *Direct in-app update checking enabled.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
